<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HUECAST</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Huecast, a weather app that shows the weather as a picture.">
  <meta name="theme-color" content="#1b1b1b">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Huecast">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="preconnect" href="https://api.open-meteo.com" crossorigin>

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
<div class="app" id="app">
  <div class="sky" aria-hidden="true">
    <div class="sky__layer"></div>
    <div class="sky__layer"></div>
    <div class="sky__darken"></div>
  </div>
  <canvas class="scene" aria-hidden="true"></canvas>

  <header class="toolbar">
    <div class="toolbar__left">
      <button class="tool" id="btn-search" type="button" aria-label="Search city" title="Search city">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      </button>
    </div>
    <div class="toolbar__right">
      <button class="tool" id="btn-random" type="button" aria-label="Random city" title="Random city">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h3.5c4.5 0 6.5 10 11 10H21M3 17h3.5c1.6 0 2.8-1.3 3.8-3M14 10c1-1.7 2.2-3 3.8-3H21M18.5 4.5L21 7l-2.5 2.5M18.5 14.5L21 17l-2.5 2.5"/></svg>
      </button>
      <button class="tool" id="btn-menu" type="button" aria-label="Options" title="Options" aria-haspopup="menu" aria-expanded="false" aria-controls="menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <div class="menu" id="menu" role="menu" aria-label="Options" hidden>
    <button class="menu__item" id="menu-locate" type="button" role="menuitem">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/><circle cx="12" cy="12" r="7"/></svg>
      <span>Use my location</span>
    </button>
    <button class="menu__item" id="menu-save" type="button" role="menuitem">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5v11"/><path d="M7.5 10 12 14.5 16.5 10"/><path d="M4.5 19.5h15"/></svg>
      <span>Save as picture</span>
    </button>
    <button class="menu__item" id="menu-scene" type="button" role="menuitem">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5.5" y="3.5" width="13" height="17" rx="3"/><circle cx="12" cy="10.5" r="2.5"/><path d="M8.5 16.5h7"/></svg>
      <span>Save as scene</span>
    </button>
    <button class="menu__item" id="menu-share" type="button" role="menuitem">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5v11"/><path d="M7.5 8 12 3.5 16.5 8"/><path d="M5.5 12v6.5a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V12"/></svg>
      <span>Share</span>
    </button>
    <button class="menu__item" id="menu-pin" type="button" role="menuitemcheckbox" aria-checked="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3.5h6l-1 6 3.5 3.5h-11L10 9.5z"/><path d="M12 13v7.5"/></svg>
      <span id="menu-pin-label">Pin this place</span>
    </button>
    <a class="menu__item" id="menu-how" href="how.html" role="menuitem">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5"/><path d="M12 7.6v.1"/></svg>
      <span>How it works</span>
    </a>
    <div class="menu__row" role="group" aria-label="Units">
      <span>Units</span>
      <div class="seg">
        <button type="button" data-unit="C" aria-pressed="false">°C</button>
        <button type="button" data-unit="F" aria-pressed="false">°F</button>
      </div>
    </div>
  </div>

  <main class="content" aria-live="polite">
    <h1 class="text-top is-status" id="condition">Locating</h1>
    <div class="icon-container" id="icon">
      <div class="loader"></div>
    </div>
    <button class="temperature" id="temp" type="button" aria-label="Switch between Celsius and Fahrenheit" hidden></button>
    <button class="retry" id="retry" type="button" hidden>Retry</button>
    <p class="text-bottom">
      <span id="city"></span>
      <span id="date"></span>
    </p>
  </main>

  <footer class="timeline" id="timeline" hidden>
    <div class="timeline__head">
      <span class="timeline__range" id="timeline-low"></span>
      <span class="timeline__label" id="timeline-label">Now</span>
      <span class="timeline__range" id="timeline-high"></span>
    </div>
    <div class="timeline__track" id="timeline-track" role="slider" tabindex="0"
         aria-label="Forecast hour" aria-valuemin="0" aria-valuemax="24" aria-valuenow="0"></div>
    <div class="timeline__night" id="timeline-night" aria-hidden="true"></div>
  </footer>

  <div class="search" id="search" role="dialog" aria-modal="true" aria-label="Search city" hidden>
    <form class="search__form" id="search-form" autocomplete="off">
      <label class="search__field">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <input class="search__input" id="search-input" type="search" placeholder="Search city" aria-label="City name"
               enterkeyhint="search" spellcheck="false" autocapitalize="words">
      </label>
      <button class="tool search__close" id="search-close" type="button" aria-label="Close search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </form>
    <ul class="search__results" id="search-results"></ul>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>
  <div class="domlog" id="domlog" hidden></div>
</div>
</body>
</html>
